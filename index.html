<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>문 패트롤</title>
<style>
  /* 아이폰 사파리: 버튼을 누르다 글자가 선택되거나 길게 눌러 복사 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff;
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:6px 8px; }
  #wrap { position:relative; background:#05051a; }
  #game { display:block; touch-action:none; image-rendering:pixelated; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px; background:rgba(0,0,0,.82); }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:46px; font-weight:900; letter-spacing:.06em; color:#ffb04a; text-shadow:0 3px 0 #8a4a0a; }
  #overlay h2 { font-size:24px; font-weight:900; }
  #overlay p { font-size:13px; color:#e6e6e6; line-height:1.6; }
  #overlay .big { font-size:18px; font-weight:800; color:#ffd23a; }
  #overlay .help { font-size:12px; color:#bdbdbd; line-height:1.7; }
  #overlay button { margin-top:6px; background:linear-gradient(180deg,#ffe0b0,#ff9a2a); color:#2a1400; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 34px; box-shadow:0 4px 0 #a85a0a; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #a85a0a; }
  #top { position:absolute; right:3px; top:2px; display:flex; gap:6px; z-index:2; }
  #top button { position:relative; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#fff; width:30px; height:30px; border-radius:8px; font-size:13px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-7px -4px; }
  /* 폰 조작판: 왼쪽 속도(◀ ▶), 오른쪽 점프·앞 포·위 포 */
  #controls { display:none; width:100%; justify-content:space-between; align-items:center; padding:0 8px; }
  #speedPad { display:flex; gap:6px; touch-action:none; }
  #speedPad button { width:58px; height:64px; border-radius:18px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:rgba(255,255,255,.8); font-size:26px; touch-action:none; }
  #speedPad button small { display:block; font-size:10px; margin-top:-2px; }
  #acts { display:flex; gap:6px; align-items:center; touch-action:none; }
  #acts button { border-radius:50%; border:3px solid rgba(255,255,255,.3); color:#fff; font-weight:900; touch-action:none; }
  #jumpBtn { width:72px; height:72px; font-size:16px; background:radial-gradient(circle at 35% 30%, #8ac8ff, #1b6ac4); }
  #fireBtn { width:54px; height:54px; font-size:13px; background:radial-gradient(circle at 35% 30%, #ffb09a, #c4361b); }
  #upBtn { width:54px; height:54px; font-size:13px; background:radial-gradient(circle at 35% 30%, #ffe89a, #c49a1b); }
  #controls button.on { transform:scale(.92); filter:brightness(1.3); }
  .pc { display:none; }
  @media (pointer:fine) { .pc { display:inline; } .touch { display:none; } }
  @media (pointer:coarse) { #controls { display:flex; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="top">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (P)">⏸</button>
    </div>
    <div id="overlay">
      <h1>문 패트롤</h1>
      <p>달 표면을 달리는 <b>버기</b>로 구덩이와 바위를 넘고,<br>UFO와 탱크를 쏘며 <b>A 부터 Z</b> 까지 가요! 🌙</p>
      <div class="help">
        <span class="pc">⌨️ ← → 속도 · 스페이스/↑ 점프 · Z 앞으로 쏘기 · X 위로 쏘기<br>P 일시정지 · M 소리</span>
        <span class="touch">👆 왼쪽 ◀ ▶ 로 속도 · 파랑 점프 · 빨강 앞으로 쏘기 · 노랑 위로 쏘기</span>
      </div>
      <button id="startBtn">시작하기</button>
    </div>
  </div>
  <div id="controls">
    <div id="speedPad"><button id="slowBtn" data-s="-1">◀<small>느리게</small></button><button id="fastBtn" data-s="1">▶<small>빠르게</small></button></div>
    <div id="acts"><button id="upBtn">위</button><button id="fireBtn">앞</button><button id="jumpBtn">점프</button></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
